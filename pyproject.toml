[tool.poetry]
name = "calib"
version = "0.0.0"  # DO NOT CHANGE - managed by Git tags and CI
description = "Calibration and reporting tools"
authors = ["Jakub Bures <buresjak@gmail.com>"]
packages = [
    { include = "iz245" },
    { include = "app" },
]



[tool.poetry.dependencies]
python = ">=3.11, <3.15"
numpy ="*"
scipy = "*"
plotly = "*"
ipympl = "*"
pandas = "2.3.3"
scikit-learn = "*"
matplotlib = "^3.10.8"
pyqtgraph =">=0.13"
PyOpenGL=">=3.1"
pyside6= "*"
psutil = "^7.2.2"
python-docx = "*"
docxtpl = "*"



[tool.poetry.group.dev.dependencies]
ipython = "*"
nbformat = "*"
pytest-cov = "*"
pytest = "*"
ipykernel = "*"
folium = "*"
black = "*"
beautifulsoup4 = "*"
jupyter = "^1.1.1"

[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

